<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timepass Games - Fun Games for Children</title>
    
    <meta name="description" content="Play hundreds of free, fun, and fast HTML5 games directly in your browser! Enjoy arcade, puzzle, action, and educational games—all mobile-friendly with no downloads required.">
    <meta name="keywords" content="free games, online games, html5 games, browser games, fun games, play now, timepass games, mobile games, games for children, arcade games, puzzle games">
    <meta name="robots" content="index, follow">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B8B;
            --secondary: #6ECBF5;
            --accent: #FFD166;
            --light: #F9F7FE;
            --dark: #2A2D43;
            --success: #06D6A0;
            --purple: #A78BFA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        body.fullscreen-mode {
            padding-bottom: 0;
        }

        body.game-detail-view .container {
            display: none;
        }

        body.game-detail-view .game-detail-page {
            display: block;
        }

        body.page-view .container {
            display: none;
        }

        body.page-view .page-content {
            display: block;
        }

        header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            animation: headerSlide 1s ease-out;
        }

        .fullscreen-mode header {
            display: none;
        }

        .game-detail-view header,
        .page-view header {
            background: var(--dark);
        }

        @keyframes headerSlide {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
            animation: sparkle 8s infinite linear;
        }

        @keyframes sparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        .circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 40px solid var(--purple);
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }

        .square {
            width: 35px;
            height: 35px;
            background: var(--success);
            top: 70%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin-bottom: 0.3rem;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            animation: fadeIn 1s ease-out;
        }

        .fullscreen-mode .container {
            display: none;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* New Content Section Styling */
        .seo-content-block {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            border-left: 5px solid var(--primary);
            animation: slideIn 1s ease-out 0.4s both;
        }
        
        .seo-content-block h2 {
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .seo-content-block p {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 1.5rem;
            line-height: 1.8;
            text-align: justify;
        }
        
        .seo-content-block strong {
            color: var(--primary);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 1.5rem;
            position: relative;
            animation: slideIn 0.8s ease-out 0.2s both;
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            font-family: 'Nunito', sans-serif;
            background: white;
            position: relative;
            z-index: 1;
        }

        .search-box:focus {
            outline: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transform: translateY(-3px) scale(1.02);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.2rem;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .search-box:focus + .search-icon {
            color: var(--secondary);
            transform: translateY(-50%) scale(1.2);
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .category-btn {
            background: white;
            border: 2px solid var(--secondary);
            color: var(--dark);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .category-btn.active {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-color: transparent;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
        }

        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            animation: cardAppear 0.6s ease-out both;
            animation-delay: calc(var(--delay) * 0.1s);
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .game-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .game-card:hover::before {
            transform: scaleX(1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .game-icon-container {
            position: relative;
            overflow: hidden;
            height: 140px;
        }

        .game-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(45deg, var(--light) 0%, #e0e7ff 100%);
            transition: all 0.5s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.1);
        }

        .game-content {
            padding: 0.8rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--dark);
            line-height: 1.3;
            text-align: center;
            transition: color 0.3s ease;
            margin-top: 0.3rem;
        }

        /* Game Detail Page Styles */
        .game-detail-page {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
            animation: fadeIn 0.5s ease-out;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3rem;
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .game-detail-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .game-detail-logo {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 5px solid white;
        }

        .game-detail-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .play-now-btn {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin: 1rem 0 2rem;
            font-family: 'Nunito', sans-serif;
        }

        .play-now-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .game-detail-description {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
        }

        .description-title {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .description-text {
            color: var(--dark);
            line-height: 1.7;
            font-size: 1.1rem;
        }

        /* Privacy Notice */
        .privacy-notice {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin: 2rem auto;
            max-width: 800px;
            border-left: 5px solid var(--accent);
        }

        .privacy-title {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .privacy-text {
            color: var(--dark);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .privacy-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .privacy-link {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .privacy-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Page Content Styles */
        .page-content {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
            animation: fadeIn 0.5s ease-out;
        }

        .page-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .page-text {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            line-height: 1.7;
            font-size: 1.1rem;
        }

        /* Fullscreen Overlay */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
        }

        .fullscreen-overlay.active {
            display: block;
        }

        .fullscreen-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(42, 45, 67, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            transition: opacity 0.3s ease;
        }

        .fullscreen-title {
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
        }

        .fullscreen-actions {
            display: flex;
            gap: 0.5rem;
        }

        .fullscreen-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            grid-column: 1 / -1;
            color: var(--dark);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .loading {
            text-align: center;
            padding: 2rem;
            grid-column: 1 / -1;
            color: var(--dark);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 107, 139, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: var(--dark);
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 0.8rem;
            z-index: 10;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: var(--accent);
        }

        .fullscreen-mode footer {
            display: none;
        }

        .game-detail-view footer,
        .page-view footer {
            position: relative;
            margin-top: 2rem;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: bubbleFloat 15s infinite linear;
            z-index: 0;
        }

        .fullscreen-mode .bubble {
            display: none;
        }

        @keyframes bubbleFloat {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            
            .game
