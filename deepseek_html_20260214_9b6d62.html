            {"name":"Candy Filler 2","icon":"https://img.gamemonetize.com/m25se62bffadd966v1hl98v6uofz72nu/512x384.jpg","link":"https://html5.gamemonetize.com/m25se62bffadd966v1hl98v6uofz72nu/","category":"Hypercasual","description":"Enjoy candy filler . Travel through tasty Candy Sweet Legend! Share these juicy candies with your friends in Candy filler Legend. Enjoy mystery journey with various candies in sweet wonderland! . Fill candy tank without spelling candies."}
        ]);
        // ========== END OF GAMES DATA ==========

        // Remove entries with empty name or link? We'll keep them but they might not display well.
        // Filter out completely empty or placeholder rows
        const games = gamesData.filter(g => g.name && g.name.trim() !== '' && g.name !== 'Name' && g.link && g.link.trim() !== '');

        // Helper: create slug from game name
        function createSlug(name) {
            return name.toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/--+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // Build a map for quick game lookup by slug
        const gameMap = new Map();
        games.forEach(game => {
            const slug = createSlug(game.name);
            if (!gameMap.has(slug)) {
                gameMap.set(slug, game);
            }
        });

        // Get unique categories
        const allCategoriesSet = new Set();
        games.forEach(game => {
            if (game.category) {
                game.category.split(',').map(c => c.trim()).forEach(c => {
                    if (c) allCategoriesSet.add(c);
                });
            }
        });
        const categories = Array.from(allCategoriesSet).sort();

        // Router and rendering
        const mainContent = document.getElementById('mainContent');
        const searchInput = document.getElementById('searchInput');

        function renderHome(selectedCategory = null, searchTerm = '') {
            let filteredGames = games;
            if (selectedCategory) {
                filteredGames = games.filter(game => {
                    if (!game.category) return false;
                    const cats = game.category.split(',').map(c => c.trim());
                    return cats.includes(selectedCategory);
                });
            }
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredGames = filteredGames.filter(game => 
                    game.name.toLowerCase().includes(term) || 
                    (game.description && game.description.toLowerCase().includes(term))
                );
            }

            const categoryChips = categories.map(cat => 
                `<span class="category-chip ${selectedCategory === cat ? 'active' : ''}" data-category="${cat}">${cat}</span>`
            ).join('');

            const gamesHtml = filteredGames.map(game => {
                const slug = createSlug(game.name);
                const icon = game.icon || 'https://via.placeholder.com/180x100?text=No+Icon';
                const cats = game.category ? game.category.split(',').map(c => c.trim()).join('</span><span>') : '';
                return `
                    <div class="game-card" data-slug="${slug}">
                        <img src="${icon}" alt="${game.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x100?text=No+Icon'">
                        <div class="info">
                            <h3>${game.name}</h3>
                            <div class="categories"><span>${cats}</span></div>
                        </div>
                    </div>
                `;
            }).join('');

            mainContent.innerHTML = `
                <div class="categories-section">
                    <h2>Categories</h2>
                    <div class="categories-grid">
                        <span class="category-chip ${!selectedCategory ? 'active' : ''}" data-category="">All</span>
                        ${categoryChips}
                    </div>
                </div>
                <div class="games-grid">
                    ${gamesHtml || '<p style="grid-column:1/-1; text-align:center;">No games found.</p>'}
                </div>
            `;

            document.querySelectorAll('.category-chip[data-category]').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    const cat = e.target.dataset.category || null;
                    window.location.hash = cat ? `#/category/${encodeURIComponent(cat)}` : '#/';
                });
            });

            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', () => {
                    const slug = card.dataset.slug;
                    window.location.hash = `#/game/${slug}`;
                });
            });
        }

        function renderGame(slug) {
            const game = gameMap.get(slug);
            if (!game) {
                renderNotFound();
                return;
            }
            const icon = game.icon || 'https://via.placeholder.com/80x80?text=No+Icon';
            const cats = game.category ? game.category.split(',').map(c => c.trim()).map(c => `<span class="category-tag">${c}</span>`).join('') : '';

            // Create iframe with the game link. We'll try to embed directly.
            // Some links might be to a page that cannot be embedded; but we proceed.
            const iframeSrc = game.link;

            mainContent.innerHTML = `
                <button class="back-btn" id="backBtn">← Back</button>
                <div class="detail-view">
                    <div class="detail-header">
                        <img src="${icon}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/80x80?text=No+Icon'">
                        <div>
                            <h1>${game.name}</h1>
                            <div class="detail-meta">${cats}</div>
                        </div>
                    </div>
                    <div class="game-frame-container" id="gameFrameContainer">
                        <iframe class="game-frame" src="${iframeSrc}" allowfullscreen allow="autoplay; fullscreen; gamepad *; clipboard-write;" loading="lazy"></iframe>
                        <button class="fullscreen-btn" id="fullscreenBtn">⛶ Fullscreen</button>
                    </div>
                    <div class="description">
                        ${game.description ? game.description.replace(/\n/g, '<br>') : 'No description available.'}
                    </div>
                </div>
            `;

            document.getElementById('backBtn').addEventListener('click', () => {
                window.history.back();
            });

            // Fullscreen functionality
            const container = document.getElementById('gameFrameContainer');
            const iframe = container.querySelector('iframe');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            fullscreenBtn.addEventListener('click', () => {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) {
                    iframe.msRequestFullscreen();
                }
            });
        }

        function renderCategory(category) {
            renderHome(category, '');
        }

        function renderNotFound() {
            mainContent.innerHTML = `
                <div class="not-found">
                    <h2>404 - Game Not Found</h2>
                    <p>The game you're looking for doesn't exist.</p>
                    <button class="back-btn" id="backBtn">← Back to Home</button>
                </div>
            `;
            document.getElementById('backBtn').addEventListener('click', () => {
                window.location.hash = '#/';
            });
        }

        function router() {
            const hash = window.location.hash.slice(1) || '/';
            const parts = hash.split('/').filter(p => p);

            if (parts.length === 0 || (parts.length === 1 && parts[0] === '')) {
                renderHome();
            } else if (parts[0] === 'category' && parts[1]) {
                const category = decodeURIComponent(parts[1]);
                renderCategory(category);
            } else if (parts[0] === 'game' && parts[1]) {
                renderGame(parts[1]);
            } else {
                renderNotFound();
            }
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);

        // Search
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const term = e.target.value.trim();
                if (term) {
                    renderHome(null, term);
                } else {
                    router();
                }
            }, 300);
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * games.length);
            const randomGame = games[randomIndex];
            const slug = createSlug(randomGame.name);
            window.location.hash = `#/game/${slug}`;
        });

        window.addEventListener('popstate', () => {
            router();
        });
    </script>
</body>
</html>
